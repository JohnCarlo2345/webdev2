<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Book</title>
    <style>.error { color: red; }</style>
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <h1>Add New Book</h1>

    <form th:action="@{/books}" th:object="${book}" method="post">
        <div>
            <label>Title:</label><br>
            <input type="text" th:field="*{title}" />
            <span th:errors="*{title}" class="error"></span>
        </div>

        <div>
            <label>Author:</label><br>
            <input type="text" th:field="*{author}" />
            <span th:errors="*{author}" class="error"></span>
        </div>

        <div>
            <label>Price:</label><br>
            <input type="number" step="0.01" th:field="*{price}" />
            <span th:errors="*{price}" class="error"></span>
        </div>

        <br>
        <button type="submit">Save Book</button>
    </form>
</body>
</html>
